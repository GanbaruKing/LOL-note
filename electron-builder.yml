appId: io.github.ganbaruking.lolnote
productName: RiftNote
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - LICENSE
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RiftNote
  deleteAppDataOnUninstall: false
artifactName: RiftNote-Setup-${version}-${arch}.${ext}
